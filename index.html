<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>专业全景查看器 · 最终版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        .viewer-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background: #000;
        }

        .viewer-wrap {
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 30px rgba(255,255,255,0.15);
            overflow: hidden;
            background: #111;
            position: relative;
        }
        .viewer-wrap canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #tip, .param-tip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.85);
            font-size: 14px;
            pointer-events: none;
            text-shadow: 0 0 10px black;
            z-index: 5;
            background: rgba(0,0,0,0.5);
            padding: 8px 18px;
            border-radius: 30px;
            display: none;
            white-space: nowrap;
        }
        .param-tip {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            margin-top: 40px;
        }

        .controls-panel {
            flex-shrink: 0;
            width: 100%;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 14px 10px 18px;
            z-index: 10;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .fov-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: 12px;
            width: 100%;
            max-width: 320px;
            justify-content: center;
        }
        .fov-label { opacity: 0.8; }
        .fov-slider {
            -webkit-appearance: none;
            width: 140px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.3);
            outline: none;
        }
        .fov-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 11px;
            background: #1a73e8;
            cursor: pointer;
            border: none;
        }
        .fov-value {
            min-width: 36px;
            text-align: center;
            font-weight: 500;
        }

        .dpad-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .zoom-side-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            font-size: 24px;
            font-weight: 300;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .zoom-side-btn:active {
            background: rgba(255,255,255,0.2);
            transform: scale(0.92);
        }
        .dpad {
            display: grid;
            grid-template-columns: 44px 44px 44px;
            grid-template-rows: 44px 44px 44px;
            gap: 5px;
        }
        .dpad button {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .dpad button:active {
            background: rgba(255,255,255,0.2);
            transform: scale(0.92);
        }
        .dpad .empty {
            background: transparent;
            border: none;
        }

        .action-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .ui-btn {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ui-btn:active {
            background: rgba(255,255,255,0.2);
            transform: scale(0.96);
        }
        .ui-btn.accent {
            background: #1a73e8;
            border-color: #1a73e8;
            font-weight: 600;
        }

        #fileInput { display: none; }

        .preview-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .preview-overlay.active { display: flex; }
        .preview-img {
            max-width: 90%;
            max-height: 65%;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .preview-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .preview-actions .ui-btn {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
<div class="viewer-area">
    <div class="viewer-wrap" id="viewerContainer">
        <div id="tip">请选择一张全景图</div>
        <div class="param-tip">推荐 2:1 等距矩形全景图</div>
    </div>
</div>

<div class="controls-panel">
    <div class="fov-row">
        <span class="fov-label">视角</span>
        <input type="range" id="fovSlider" class="fov-slider" min="50" max="130" value="75" step="1">
        <span id="fovValue" class="fov-value">75°</span>
    </div>

    <div class="dpad-wrapper">
        <button id="zoomOutBtn" class="zoom-side-btn" title="缩小">－</button>
        <div class="dpad">
            <div class="empty"></div>
            <button id="btnUp">▲</button>
            <div class="empty"></div>
            <button id="btnLeft">◀</button>
            <div class="empty"></div>
            <button id="btnRight">▶</button>
            <div class="empty"></div>
            <button id="btnDown">▼</button>
            <div class="empty"></div>
        </div>
        <button id="zoomInBtn" class="zoom-side-btn" title="放大">＋</button>
    </div>

    <div class="action-row">
        <button class="ui-btn" id="uploadBtn">📁 打开</button>
        <button class="ui-btn accent" id="screenshotBtn">📸 截图</button>
        <button class="ui-btn" id="resetBtn">↺ 重置</button>
    </div>
</div>
<input type="file" id="fileInput" accept="image/*">

<div class="preview-overlay" id="previewOverlay">
    <img id="previewImage" class="preview-img" alt="截图预览" />
    <div class="preview-actions">
        <button class="ui-btn" id="downloadBtn">⬇️ 下载图片</button>
        <button class="ui-btn" id="shareBtn">📤 分享/保存</button>
        <button class="ui-btn" id="closePreview">✕ 关闭</button>
    </div>
</div>

<!-- 本地 three.js 库 -->
<script src="three.min.js"></script>
<script>
    (function() {
        const container = document.getElementById('viewerContainer');
        const tip = document.getElementById('tip');
        const paramTip = document.querySelector('.param-tip');

        // 场景初始化
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);

        // 默认 FOV 75°
        const DEFAULT_FOV = 75;
        const camera = new THREE.PerspectiveCamera(DEFAULT_FOV, 16/9, 0.05, 100);
        camera.position.set(0, 0, 0.1);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // 高精度球体
        const geometry = new THREE.SphereGeometry(10, 256, 128);
        const material = new THREE.MeshBasicMaterial({
            side: THREE.BackSide,
            color: 0xffffff
        });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // 视角状态（平视初始，lat=0）
        let lon = 0, lat = 0;
        const maxLat = Math.PI / 2.05;

        let isDragging = false;
        let lastPointer = { x: 0, y: 0 };
        let startLon = 0, startLat = 0;

        // 无惯性，所以不用 vLon/vLat

        let zoomLevel = 0.05;
        const minZoom = 0.03;
        const maxZoom = 3.0;
        const ZOOM_STEP = 0.12;

        let initialPinchDistance = 0;
        let initialZoom = 0.05;
        let isPinching = false;

        // 方向按键步长：上下为小步进，左右为45°
        const STEP_SMALL = Math.PI / 120;   // 约1.5°
        const STEP_BIG = Math.PI / 4;       // 45°

        const canvas = renderer.domElement;

        // FOV 滑块
        const fovSlider = document.getElementById('fovSlider');
        const fovValue = document.getElementById('fovValue');
        fovSlider.addEventListener('input', () => {
            const newFov = parseFloat(fovSlider.value);
            camera.fov = newFov;
            camera.updateProjectionMatrix();
            fovValue.textContent = newFov + '°';
        });

        // 辅助函数
        function getEventPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            if (e.changedTouches && e.changedTouches.length > 0) {
                return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function getPinchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // 触摸/鼠标事件
        canvas.addEventListener('touchstart', onPointerDown, { passive: false });
        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('touchmove', onPointerMove, { passive: false });
        canvas.addEventListener('mousemove', onPointerMove);
        canvas.addEventListener('touchend', onPointerUp);
        canvas.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('mouseleave', onPointerUp);
        canvas.addEventListener('wheel', onWheel, { passive: false });

        function onPointerDown(e) {
            e.preventDefault();
            const touches = e.touches;
            if (touches && touches.length === 2) {
                isPinching = true;
                isDragging = false;
                initialPinchDistance = getPinchDistance(touches);
                initialZoom = zoomLevel;
                return;
            }
            isPinching = false;
            isDragging = true;
            const pos = getEventPos(e);
            lastPointer = pos;
            startLon = lon;
            startLat = lat;
            tip.style.display = 'none';
            paramTip.style.display = 'none';
        }

        function onPointerMove(e) {
            e.preventDefault();
            const touches = e.touches;
            if (touches && touches.length === 2 && isPinching) {
                const currentDistance = getPinchDistance(touches);
                if (initialPinchDistance > 0) {
                    const scale = initialPinchDistance / currentDistance;
                    zoomLevel = Math.max(minZoom, Math.min(maxZoom, initialZoom * scale));
                }
                return;
            }
            if (!isDragging || isPinching) return;

            const pos = getEventPos(e);
            const dx = pos.x - lastPointer.x;
            const dy = pos.y - lastPointer.y;

            const sensitivity = 0.003;
            lon = startLon - dx * sensitivity;
            lat = startLat - dy * sensitivity;
            lat = Math.max(-maxLat, Math.min(maxLat, lat));

            // 完全去除惯性，松开即停
        }

        function onPointerUp(e) {
            const touches = e.touches;
            if (!touches || touches.length < 2) isPinching = false;
            if (!touches || touches.length === 0) isDragging = false;
        }

        function onWheel(e) {
            e.preventDefault();
            zoomLevel += e.deltaY * 0.001;
            zoomLevel = Math.max(minZoom, Math.min(maxZoom, zoomLevel));
        }

        // 方向键
        function addDirectionListeners() {
            document.getElementById('btnUp').addEventListener('click', () => {
                lat = Math.max(-maxLat, lat - STEP_SMALL);
            });
            document.getElementById('btnDown').addEventListener('click', () => {
                lat = Math.min(maxLat, lat + STEP_SMALL);
            });
            document.getElementById('btnLeft').addEventListener('click', () => {
                lon -= STEP_BIG;   // 左转45°
            });
            document.getElementById('btnRight').addEventListener('click', () => {
                lon += STEP_BIG;   // 右转45°
            });
        }
        addDirectionListeners();

        document.getElementById('zoomInBtn').addEventListener('click', () => {
            zoomLevel = Math.max(minZoom, zoomLevel - ZOOM_STEP);
        });
        document.getElementById('zoomOutBtn').addEventListener('click', () => {
            zoomLevel = Math.min(maxZoom, zoomLevel + ZOOM_STEP);
        });

        // 图片加载（自动水平翻转解决文字反向）
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        uploadBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                // 创建离屏 canvas 进行水平翻转
                const flipCanvas = document.createElement('canvas');
                flipCanvas.width = img.width;
                flipCanvas.height = img.height;
                const ctx = flipCanvas.getContext('2d');
                // 镜像翻转：将图像绘制到 canvas 上时水平反转
                ctx.translate(img.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(img, 0, 0);

                const texture = new THREE.CanvasTexture(flipCanvas);
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.anisotropy = renderer.capabilities.getMaxAnisotropy() || 4;
                texture.minFilter = THREE.LinearMipmapLinearFilter;
                texture.magFilter = THREE.LinearFilter;
                texture.generateMipmaps = true;

                sphere.material.map = texture;
                sphere.material.needsUpdate = true;
                tip.style.display = 'none';
                paramTip.style.display = 'none';

                URL.revokeObjectURL(url);
            };
            img.onerror = () => {
                alert('图片加载失败，请检查格式');
                URL.revokeObjectURL(url);
            };
            img.src = url;
        });

        // 截图功能（保持不变）
        const screenshotBtn = document.getElementById('screenshotBtn');
        const previewOverlay = document.getElementById('previewOverlay');
        const previewImage = document.getElementById('previewImage');
        const downloadBtn = document.getElementById('downloadBtn');
        const shareBtn = document.getElementById('shareBtn');
        const closePreview = document.getElementById('closePreview');
        let currentScreenshotBlob = null;

        async function takeScreenshot() {
            return new Promise(resolve => {
                renderer.domElement.toBlob(blob => resolve(blob), 'image/png', 1.0);
            });
        }

        screenshotBtn.addEventListener('click', async () => {
            if (!sphere.material.map) {
                alert('请先加载全景图');
                return;
            }
            const blob = await takeScreenshot();
            if (!blob) return;
            currentScreenshotBlob = blob;
            const url = URL.createObjectURL(blob);
            previewImage.src = url;
            previewOverlay.classList.add('active');
        });

        closePreview.addEventListener('click', () => {
            previewOverlay.classList.remove('active');
            if (previewImage.src.startsWith('blob:')) URL.revokeObjectURL(previewImage.src);
            currentScreenshotBlob = null;
        });

        downloadBtn.addEventListener('click', () => {
            if (!currentScreenshotBlob) return;
            const url = URL.createObjectURL(currentScreenshotBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `panorama-${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        shareBtn.addEventListener('click', async () => {
            if (!currentScreenshotBlob) return;
            const file = new File([currentScreenshotBlob], `panorama-${Date.now()}.png`, { type: 'image/png' });
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ files: [file], title: '全景截图' });
                } catch (err) {
                    downloadBtn.click();
                }
            } else {
                downloadBtn.click();
            }
        });

        // 重置：平视（lat=0, lon=0），恢复默认缩放和 FOV
        document.getElementById('resetBtn').addEventListener('click', () => {
            lon = 0;
            lat = 0;
            zoomLevel = 0.05;
            camera.fov = DEFAULT_FOV;
            camera.updateProjectionMatrix();
            fovSlider.value = DEFAULT_FOV;
            fovValue.textContent = DEFAULT_FOV + '°';
            tip.style.display = 'block';
            tip.textContent = '视角已重置';
            paramTip.style.display = 'none';
            setTimeout(() => { if (tip.textContent === '视角已重置') tip.style.display = 'none'; }, 1500);
        });

        // 尺寸自适应
        function resizeViewer() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            if (w === 0 || h === 0) return;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resizeViewer);
        const resizeObserver = new ResizeObserver(() => resizeViewer());
        resizeObserver.observe(container);
        resizeViewer();

        // 渲染循环（无惯性，无需计算速度衰减）
        function animate() {
            requestAnimationFrame(animate);

            camera.position.z = zoomLevel;
            sphere.rotation.y = lon;
            sphere.rotation.x = lat;
            renderer.render(scene, camera);
        }
        animate();

        tip.style.display = 'block';
        paramTip.style.display = 'block';
    })();
</script>
</body>
</html>
